<style>
.card{display:block;width:100%;box-sizing:border-box;border:none;border-radius:16px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);padding:18px 12px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hd{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0 6px}
.mark{height:17px;width:auto;flex:none;fill:var(--tg-theme-text-color)}
.t{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--tg-theme-text-color)}
.s{font-size:11px;color:var(--tg-theme-hint-color);margin:0 0 12px}
.code{display:block;font-family:ui-monospace,monospace;font-size:25px;letter-spacing:7px;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
.mask{color:var(--tg-theme-hint-color);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.reveal{letter-spacing:0}
.reveal span{display:inline-block;margin-right:7px;animation:rise .4s both;animation-delay:calc(var(--d)*.05s)}
.reveal span:last-child{margin-right:0}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.hint{display:block;font-size:11px;color:var(--tg-theme-hint-color);margin-top:9px}
.hint.ok{color:var(--tg-theme-link-color)}
</style>
<button class="card" id="b" aria-label="Reveal and copy your code"><span class="hd"><svg class="mark" id="m" viewBox="100.6 100.6 523.8 291.8" aria-hidden="1"></svg><span class="t">Security Verification</span></span><p class="s">shovith.runs-on.dev · secured download</p><span class="code mask" id="c">&bull;&bull;&bull;&nbsp;&bull;&bull;&bull;</span><span class="hint" id="h">Tap to reveal &amp; copy</span></button>
<script>
var W=window.TelegramWidget||{copyText:function(t){console.log(t)},HapticFeedback:{notificationOccurred:function(){}}};
var code=null;try{code=JSON.parse(W.chatData).c}catch(e){}
var B='.XXX.XXX. X...X...X XXXX.X..X ...X.X..X XXX..XXX.'.split(' ');
for(var r=0,cells=[];r<5;r++)for(var c=0;c<9;c++)if(B[r][c]==='X'){
var e=document.createElementNS('http://www.w3.org/2000/svg','rect');
e.setAttribute('x',100.6+c*58);e.setAttribute('y',100.6+r*58);
e.setAttribute('width',59.8);e.setAttribute('height',59.8);e.setAttribute('rx',10.5);
e.setAttribute('opacity','0');cells.push(e);document.getElementById('m').appendChild(e)}
var i=0;var asm=setInterval(function(){if(i>=cells.length)return clearInterval(asm);cells[i++].setAttribute('opacity','1')},16);
var b=document.getElementById('b'),c=document.getElementById('c'),h=document.getElementById('h');
if(!code){h.textContent='Code unavailable — restart verification on the website'}
b.addEventListener('click',function(){if(!code)return;
if(c.className==='code mask'){
var s='';for(var k=0;k<6;k++)s+='<span style="--d:'+k+'">'+code[k]+'</span>';
c.className='code reveal';c.innerHTML=s}
W.copyText(code);W.HapticFeedback.notificationOccurred('success');h.className='hint ok';h.textContent='Copied — enter it on the website'});
</script>
