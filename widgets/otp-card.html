<style>
.card{display:block;width:100%;box-sizing:border-box;position:relative;overflow:hidden;border:none;border-radius:16px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);padding:18px 12px 14px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);animation:cardIn .5s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cardIn{from{opacity:0;transform:scale(.96)}}
#fx{position:absolute;inset:0;width:100%;height:100%}
.hd,#s,.code,.hint{position:relative}
.hd{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0 6px}
.mark{height:17px;width:auto;flex:none;fill:var(--tg-theme-text-color)}
.t{font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--tg-theme-text-color)}
#s{font-size:11px;color:var(--tg-theme-hint-color);margin:0 0 12px}
.code{display:block;font-family:ui-monospace,monospace;font-size:25px;letter-spacing:7px;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
.mask{color:var(--tg-theme-hint-color);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.reveal{letter-spacing:0;animation:pop .35s .55s both}
.reveal span{display:inline-block;margin-right:7px;animation:rise .4s both;animation-delay:calc(var(--d)*.05s)}
.reveal span:last-child{margin-right:0}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{40%{transform:scale(1.035)}}
.hint{display:block;font-size:11px;color:var(--tg-theme-hint-color);margin-top:9px}
.hint.ok{color:var(--tg-theme-link-color)}
.card::after{content:'';position:absolute;top:0;bottom:0;left:0;width:45%;transform:translateX(-130%) skewX(-16deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:sweep 1.4s .45s cubic-bezier(.4,0,.2,1) both}
@keyframes sweep{to{transform:translateX(320%) skewX(-16deg)}}
@media (prefers-reduced-motion:reduce){.card,.mask,.reveal,.reveal span,.card::after{animation:none}}
</style>
<button class="card" id="b" aria-label="Reveal and copy your code"><canvas id="fx" width="320" height="160" aria-hidden="1"></canvas><span class="hd"><svg class="mark" id="m" viewBox="100.6 100.6 523.8 291.8" aria-hidden="1"></svg><span class="t">Security Verification</span></span><p id="s">shovith.runs-on.dev · secured download</p><span class="code mask" id="c">&bull;&bull;&bull;&nbsp;&bull;&bull;&bull;</span><span class="hint" id="h">Tap to reveal &amp; copy</span></button>
<script>
var W=window.TelegramWidget||{copyText:function(t){console.log(t)},HapticFeedback:{notificationOccurred:function(){}}};
var code=null;try{code=JSON.parse(W.chatData).c}catch(e){}
var B='.XXX.XXX. X....X..X XXXX.X..X ...X.X..X XXX..XXX.'.split(' ');
for(var r=0,cells=[];r<5;r++)for(var c=0;c<9;c++)if(B[r][c]==='X'){
var e=document.createElementNS('http://www.w3.org/2000/svg','rect');
e.setAttribute('x',100.6+c*58);e.setAttribute('y',100.6+r*58);
e.setAttribute('width',59.8);e.setAttribute('height',59.8);e.setAttribute('rx',10.5);
document.getElementById('m').appendChild(e);cells.push(e)}
var i=0;var asm=setInterval(function(){if(i>=cells.length)return clearInterval(asm);cells[i++].removeAttribute('opacity')},16);
var T=W.themeParams||{},C1=T.button_color||'#3390ec',C2=T.link_color||'#3390ec';
function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
var fx=document.getElementById('fx'),g=fx.getContext('2d'),t0=Date.now(),last=0;
function blob(x,y,rr,col,a){var gr=g.createRadialGradient(x,y,0,x,y,rr);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.beginPath();g.arc(x,y,rr,0,6.283);g.fill()}
function draw(){g.clearRect(0,0,320,160);var t=(Date.now()-t0)/1000;
blob(160+105*Math.sin(t*.42),80+40*Math.sin(t*.8+1.3),60+9*Math.sin(t*.6),C1,.13);
blob(160+85*Math.sin(-t*.31+2.1),80+38*Math.cos(t*.52),52+7*Math.cos(t*.47),C2,.10);
blob(160+95*Math.sin(t*.24+4),80+30*Math.sin(t*.37+.6),48,C1,.07)}
function loop(ts){if(ts-last>32){last=ts;draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
var b=document.getElementById('b'),c=document.getElementById('c'),h=document.getElementById('h');
if(!code){h.textContent='Code unavailable — restart verification on the website'}
b.addEventListener('click',function(){if(!code)return;
if(c.className==='code mask'){
var s='';for(var k=0;k<6;k++)s+='<span style="--d:'+k+'">'+code[k]+'</span>';
c.className='code reveal';c.innerHTML=s}
W.copyText(code);W.HapticFeedback.notificationOccurred('success');h.className='hint ok';h.textContent='Copied — enter it on the website'});
</script>
