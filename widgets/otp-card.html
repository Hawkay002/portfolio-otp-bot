<style>
.hd{display:flex;align-items:center;gap:7px;margin:2px 0 5px}
.hd svg{flex:none;color:var(--tg-theme-button-color)}
.t{font-size:15px;font-weight:700;color:var(--tg-theme-text-color)}
.s{font-size:12px;color:var(--tg-theme-hint-color);margin:0 0 10px}
.card{display:block;width:100%;box-sizing:border-box;border:none;border-radius:14px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);padding:16px 12px;text-align:center;cursor:pointer}
.code{display:block;font-family:ui-monospace,monospace;font-size:25px;letter-spacing:7px;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text;transition:opacity .15s}
.mask{color:var(--tg-theme-hint-color)}
.hint{display:block;font-size:11px;color:var(--tg-theme-hint-color);margin-top:9px}
</style>
<div>
  <div class="hd"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="1"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg><span class="t">Security Verification</span></div>
  <p class="s">shovith.runs-on.dev · secured download</p>
  <button class="card" id="b" aria-label="Reveal and copy your code"><span class="code mask" id="c">&bull;&bull;&bull;&nbsp;&bull;&bull;&bull;</span><span class="hint" id="h">Tap to reveal &amp; copy</span></button>
</div>
<script>
var W=window.TelegramWidget||{copyText:function(t){console.log(t)},HapticFeedback:{notificationOccurred:function(){}}};
var code=null;try{code=JSON.parse(W.chatData).c}catch(e){}
var b=document.getElementById('b'),c=document.getElementById('c'),h=document.getElementById('h');
if(!code){h.textContent='Code unavailable — restart verification on the website'}
b.addEventListener('click',function(){if(!code)return;
if(c.className==='code mask'){c.textContent=code;c.className='code'}
W.copyText(code);W.HapticFeedback.notificationOccurred('success');h.textContent='Copied — enter it on the website'});
</script>
