<style>
.hd{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 5px}
.mark{display:grid;grid-template-columns:repeat(9,3px);grid-auto-rows:3px;gap:1px;flex:none}
.mark div{border-radius:1px}
.mark div.on{background:var(--tg-theme-text-color)}
.t{font-size:15px;font-weight:700;color:var(--tg-theme-text-color)}
.s{font-size:12px;color:var(--tg-theme-hint-color);margin:0 0 10px}
.card{display:block;width:100%;box-sizing:border-box;border:none;border-radius:14px;background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color);padding:16px 12px;text-align:center;cursor:pointer}
.code{display:block;font-family:ui-monospace,monospace;font-size:25px;letter-spacing:7px;font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text;transition:opacity .15s}
.mask{color:var(--tg-theme-hint-color)}
.hint{display:block;font-size:11px;color:var(--tg-theme-hint-color);margin-top:9px}
</style>
<button class="card" id="b" aria-label="Reveal and copy your code"><span class="mark" id="m"></span><span class="t">Security Verification</span><p class="s">shovith.runs-on.dev · secured download</p><span class="code mask" id="c">&bull;&bull;&bull;&nbsp;&bull;&bull;&bull;</span><span class="hint" id="h">Tap to reveal &amp; copy</span></button>
<script>
var W=window.TelegramWidget||{copyText:function(t){console.log(t)},HapticFeedback:{notificationOccurred:function(){}}};
var code=null;try{code=JSON.parse(W.chatData).c}catch(e){}
var B='.XXX.XXX. X...X...X XXXX.X..X ...X.X..X XXX..XXX.'.split(' ');
for(var r=0,h='';r<5;r++)for(var c=0;c<9;c++)h+='<div class="'+(B[r][c]==='X'?'on':'')+'"></div>';
document.getElementById('m').innerHTML=h;
var b=document.getElementById('b'),c=document.getElementById('c'),h2=document.getElementById('h');
if(!code){h2.textContent='Code unavailable — restart verification on the website'}
b.addEventListener('click',function(){if(!code)return;
if(c.className==='code mask'){c.textContent=code;c.className='code'}
W.copyText(code);W.HapticFeedback.notificationOccurred('success');h2.textContent='Copied — enter it on the website'});
</script>
